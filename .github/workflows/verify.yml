name: 検査

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 読むだけで足りる。書き込みの権限は、要る仕事にだけ名指しで渡す。
permissions:
  contents: read

jobs:
  check:
    name: データ・出典表記・原画像の混入 / 正誤表の監査 68 項目
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: 誤変換とバッジ記法
        run: python3 verification/check_text.py
      # 正誤表の監査に pypdf が要る。data/check.py も「検査の結果」の表を確かめるために
      # 正誤表の監査を走らせるので、先に入れる。
      - run: pip install pypdf
      - run: python3 data/check.py
      - name: 正誤表が紙面からずれていないか（68 項目）
        run: python3 verification/check_errata.py
