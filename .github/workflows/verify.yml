name: 検査

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: データ・出典表記・原画像の混入 / 正誤表の監査 59 項目
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 誤変換とバッジ記法
        run: python3 verification/check_text.py
      # 正誤表の監査に pypdf が要る。data/check.py も「検査の結果」の表を確かめるために
      # 正誤表の監査を走らせるので、先に入れる。
      - run: pip install pypdf
      - run: python3 data/check.py
      - name: 正誤表が紙面からずれていないか（59 項目）
        run: python3 verification/check_errata.py
